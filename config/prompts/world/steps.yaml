common:
  system: |
    Write neutral reference material. Return JSON only, in the requested language.
    Describe what exists, how it works and why as objective facts.
    Never describe scenes, spoken lines, narration, viewpoint characters or dramatic sequences.
  user: |
    OUTPUT LANGUAGE: {language}
    OPERATION: {operator}
    TASK: {task}
    TARGET: {target}
    BRIEF STATEMENTS:
    {statements}
    WORLD AXES:
    {axes}
    LOCAL CONTEXT:
    {context}
    WORLD CONTRACT:
    {contract}
    FIELDS ALREADY DECIDED:
    {entity}
    STEP: {step}
    SLOT: {slot}
    INSTRUCTION: {instruction}
    Generate only the requested item. Respect the supplied input and the contract.
    Use only defined units and their combinations, and defined calendar markers.
    Do not propose additions to the contract.
    CORRECTION:
    {correction}
steps:
  type: Choose one of the allowed entity types.
  grounding: Give the statement ids or local entity ids supporting this entity and explain the derivation. If derived_from is nonempty, give a reason of at least 10 characters.
  name: Give this entity one specific name in the output language, different from all existing entity names.
  axes: Choose one to three supplied axis ids for this entity.
  summary: Give one objective explanation of this entity, 40 to 600 characters, adding information beyond the brief and local context.
  fact: 'Give exactly one {kind} fact about {name}. {kind_instruction}'
  relations: Give zero to three additional relations to ids in the local context. Do not refer to this entity itself.
  fact_check: 'Check whether the single fact below is a {kind} fact about {name}: {fact}. {kind_instruction} Return matches and a reason.'
  review: Review the assembled entity for consistency, objective register, absence of narrative voice, and compatibility with the supplied world contract and input. Return the four verdicts and issues identifying only name, summary or an indexed fact that must be corrected. For each false verdict, identify at least one affected field and explain why.
fact_kinds:
  number: State one measurement with a numeric value and a non-time unit from the contract when present.
  proper_noun: State one fact containing a specific proper name and its connection to this entity.
  object: State one fact about a physical item and this entity's use, ownership, location or handling of it.
  procedure: State one observable procedure performed by or on this entity.
  period: State one date or period with a defined calendar marker and a numeric value or duration expression.
