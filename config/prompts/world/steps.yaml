common:
  system: |
    Write neutral reference material. Return JSON only, in the requested language.
    Describe what exists, how it works and why as objective facts.
    Never describe scenes, spoken lines, narration, viewpoint characters or dramatic sequences.
  user: |
    OUTPUT LANGUAGE: {language}
    OPERATION: {operator}
    TASK: {task}
    TARGET: {target}
    BRIEF STATEMENTS:
    {statements}
    WORLD AXES:
    {axes}
    LOCAL CONTEXT:
    {context}
    WORLD CONTRACT:
    {contract}
    FIELDS ALREADY DECIDED:
    {entity}
    STEP: {step}
    SLOT: {slot}
    INSTRUCTION: {instruction}
    Generate only the requested item. Respect the supplied input and the contract.
    Use only defined units and their combinations, and defined calendar markers.
    Use technology.units[].symbol as the unit notation; quantity describes what it measures.
    Use calendar.name, calendar.markers and society.institutions[].name verbatim
    as short notations in body text; origin and description contain explanations.
    Do not propose additions to the contract.
    CORRECTION:
    {correction}
steps:
  type: Choose one of the allowed entity types.
  grounding: Give the statement ids or local entity ids supporting this entity and explain the derivation. If derived_from is nonempty, give a reason of at least 10 characters.
  name: Give this entity one specific name in the output language, different from all existing entity names.
  axes: Choose one to three supplied axis ids for this entity.
  summary: Give one objective explanation of this entity, 40 to 600 characters, adding information beyond the brief and local context.
  fact_element:
    number: 'Choose only the measurement elements for one number fact about {name}: subject (what is measured, 1 to 80 characters), value (a number), and unit (one of the contract technology.units[].symbol values, or 1 to 20 characters when no contract exists). The quantity field describes what each unit measures. Use a non-time measurement unit. Do not write the fact text.'
    proper_noun: 'Choose only a new proper name about {name}, 2 to 30 characters. It must not occur in the raw input, brief, local entity names or facts, existing entity names, or contract terms after NFKC normalization, whitespace removal and lowercasing. Do not write the fact text.'
    object: 'Choose only a physical item about {name}: object (1 to 30 characters). Do not write the fact text.'
    procedure: 'Choose only the elements of one observable procedure about {name}: actor (1 to 30 characters) and action (1 to 60 characters). Do not write the fact text.'
    period: 'Choose only the elements of one date or period about {name}: marker (the contract calendar.name or one of calendar.markers) and value (a number). Do not write the fact text.'
  fact_text: |
    Give exactly one {kind} fact about {name}, an objective statement of 5 to 200 characters.
    Return only fact. Include the following decided elements verbatim in the fact text:
    FACT ELEMENTS:
    {elements}
  relations: Give zero to three additional relations to ids in the local context. Do not refer to this entity itself.
  review: Review the assembled entity for consistency, objective register, absence of narrative voice, and compatibility with the supplied world contract and input. Return the three verdicts and issues identifying only name, summary or an indexed fact that must be corrected. For each false verdict, identify at least one affected field and explain why.
