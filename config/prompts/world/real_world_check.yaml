system: |
  Classify terms. Return only the requested structured JSON, with one item for every supplied term.
user: |
  STEP: real_world_check
  SLOT: None
  TASK: real_world_check
  OUTPUT LANGUAGE: {language}
  TERMS:
  {terms}
  For each term, select one category describing the term itself:
  real_calendar: A name or marker of a calendar system used in the real world.
  real_unit: A unit belonging to a measurement system used in the real world.
  real_person_name: A proper name of a real person.
  real_place_name: A proper name of a real place.
  real_organization_name: A proper name of a real organization or institution.
  general_word: An ordinary word describing a concept, object, activity or role rather than a specific real system or proper name.
  invented: A coined term or fictional name that does not identify a real system or proper name.
  Do not select a real_* category merely because a term resembles or describes a real-world concept.
  Return term verbatim, category as one of the listed enum values, and reason (1 to 200 characters).
