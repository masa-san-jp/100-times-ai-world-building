# ========================================
# Backend and engine configuration
# 100 TIMES AI WORLD BUILDING
# ========================================
# Model names live here (and in --model), never in code.

# LLM backend. Choose "ollama" (default) or "anthropic".
backend: "ollama"

# Optional Anthropic backend settings. Credentials are resolved by the
# official SDK from its normal environment/profile configuration.
anthropic:
  # Model-dependent values may change across model generations; review this
  # section when replacing the model.
  model: "claude-opus-5"
  timeout: 900.0
  max_retries: 2  # Let the Anthropic SDK handle retries.
  request_options:
    max_tokens: 64000
    thinking:
      type: "adaptive"
    output_config:
      effort: "high"
    betas:
      - "server-side-fallback-2026-07-01"
    fallbacks: "default"

# Ollama server
# ----------------------------------------
server:
  host: "http://localhost"
  port: 11434
  timeout: 900  # seconds per request
  max_retries: 3
  retry_delay: 5  # seconds

# Ollama models
# ----------------------------------------
model:
  # Model used for every generation call (override with --model).
  name: "gpt-oss:20b"

# Optional vision model, used only when --image is given (Ollama backend).
# When the Anthropic backend is used, its model reads images too.
models:
  vision: "llava:latest"

# Defaults passed to every generation call. A call that sets its own value
# wins. Keys set to null are not sent (the backend's own default applies).
generation:
  max_tokens: 8192
  num_ctx: 32768        # Ollama context window; ignored by the Anthropic backend
  think: false          # structured output should not spend its budget on reasoning
  temperature: null

# Engine settings
# ----------------------------------------
engine:
  structured:
    max_attempts: 3
  # Overrides merged over config/world/explore.yaml (selection, build,
  # operators, frontier, budget, coverage).
  explore: {}
  # Context limits and fact minimums (see src/world/operators.py:OperatorConfig).
  operator: {}

# Checkpointing
# ----------------------------------------
checkpointing:
  auto_save: true
  compression: false
  max_checkpoints_per_phase: 100

# Logging
# ----------------------------------------
logging:
  level: "INFO"
  file: "./logs/world_engine.log"
  console: true

# Output
# ----------------------------------------
# Each run is one self-contained world package under base_dir, named
# "world_<run_id>" (see README for the tree).
output:
  base_dir: "./output"
