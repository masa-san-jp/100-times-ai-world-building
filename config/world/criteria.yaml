faithful:
  level: both
  definition: Entities derive from input statements or local entities with an explained derivation; the world remains faithful to the input (world checks implemented in issue 71).
  checks: [grounding.sources, grounding.reason]
  method: structure
no_outside_premises:
  level: entity
  definition: Units and calendar markers obey the contract; real-world systems and proper names are permitted only when specified in the original input; the entity introduces no outside premises.
  checks: [contract.real_world_check, name.real_world_check, fact.real_world_check, fact.units, fact.calendar, summary.units, summary.calendar, review.no_outside_premises]
  method: judge
breadth:
  level: world
  definition: The world covers the areas derived from the input (implemented in issue 71).
  checks: [world.breadth]
  method: structure
depth:
  level: world
  definition: The world explains underlying causes and mechanisms (implemented in issue 71).
  checks: [world.depth]
  method: structure
scale:
  level: world
  definition: The world connects facts across its scale layers (implemented in issue 71).
  checks: [world.scale]
  method: structure
detail:
  level: entity
  definition: Every fact supplies its kind-specific fields and includes them in its text; proper names are new, measurements include their value and non-time unit, and periods include their calendar marker and value.
  checks: [fact.number, fact.period, fact.proper_noun, fact.object, fact.procedure]
  method: structure
objective:
  level: entity
  definition: Names use the output language's script and explanations use objective reference language without quoted speech, personal narration or narrative voice.
  checks: [name.language, summary.objectivity, summary.narrative_voice, review.objective]
  method: judge
consistent:
  level: both
  definition: Fields obey schemas, numeric facts do not contradict existing facts, relations avoid self-reference and entities have no contradictions; world consistency is implemented in issue 71.
  checks: [all.schema, fact.number_conflict, relations.self_reference, review.consistent]
  method: judge
new_information:
  level: entity
  definition: Each fact adds information absent from every existing fact. A proper name must also be absent from the original input, brief, local context, existing entity names and contract terms. A number repeats an existing number fact only when both its (value, unit) pair and its subject match; subjects match when they are equal after NFKC, whitespace removal and lowercasing or their character 3-gram Jaccard is at or above duplicate_jaccard. The same pair with another subject is new information, and brief or local text is not compared with numbers. A period's (marker, value) pair is not compared. The fact text must not equal (after NFKC, whitespace removal and lowercasing) or nearly equal (character 3-gram Jaccard at or above duplicate_jaccard) the text of any existing fact, including the other facts of the entity being built. A fact that passes those checks must also not restate, in other wording, the same claim (the same subject with the same content) as an existing fact; a fixed judge model compares it with up to restatement_candidates existing facts, chosen by the largest character 3-gram Jaccard with the fact (zero overlap excluded), and no comparison is made when there is none.
  duplicate_jaccard: 0.8
  restatement_candidates: 5
  checks: [name.duplicate, fact.new_information, fact.restatement]
  method: rule
