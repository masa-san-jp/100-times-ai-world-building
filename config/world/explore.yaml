# Autonomous exploration loop: frontier evaluation, bandit selection,
# generation, scoring, critique-and-rewrite and stop conditions.
# Nothing here names a genre, era, setting or technology.

selection:
  strategy: ucb1            # ucb1 | thompson
  exploration: 0.6          # UCB1 exploration coefficient (larger = explore more)
  epsilon: 0.05             # chance of choosing a uniformly random pair
  prior_mean: 0.5           # reward assumed for an arm that was never pulled
  prior_strength: 1.0       # pseudo-observations behind prior_mean
  item_prior_weight: 0.3    # influence of the frontier-item prior on the pick
  deficit_weight: 0.7       # share of the item prior taken from frontier deficit
  axis_weight: 0.3          # share of the item prior taken from axis weight
  depth_weight: 1.0         # weight of the depth shortage (empty lower scales) in the pair prior
  breadth_weight: 0.8       # weight of an unserved widening/viewpoint operator
  arm_by_axis: false        # also split arms by axis
  max_items_per_kind: 12    # frontier items kept per kind (most deficient first)

contract:
  max_attempts: 3            # total calls, including the first; failures do not stop exploration

generation:
  candidates: 3             # candidates per operator call
  max_rewrites: 2           # critique-and-rewrite rounds per iteration
  max_findings: 8           # deductions fed back into a rewrite
  contrast_count: 3         # contrast candidates per slot (cached in the package)
  discard_reward: 0.0       # arm reward recorded when nothing is accepted

# Operators tried for each kind of frontier item.
operators:
  empty: [premise]
  unexpanded: [zoom, expand]
  uncaused: [cause]
  thin: [history, document, perspective]
  axis_gap: [zoom, perspective, cause]   # fill gaps under/around existing entities
  low_score: [expand, cause]

# Keep long runs from spending all their budget on one descent path. These
# are operation categories, not assumptions about the world's content.
breadth:
  enabled: true
  operators: [expand, perspective, cause, history, document]
  min_entities_per_operator: 1

frontier:
  min_facts: 3                    # entities with fewer facts are "thin"
  low_score_threshold: 0.5        # stored verifier scores below this are "low_score"
  low_score_verifiers: [genericity, specificity]

# Stop conditions. Budgets may be overridden by function arguments.
budget:
  max_iterations: 200
  max_wall_seconds: null
  max_generation_calls: null
  # An iteration that raises (bad model data, backend error, timeout) is
  # recorded as discarded and the run continues; this many in a row stop it.
  max_consecutive_failures: 5

coverage:
  enabled: true
  min_axis_entities: 1            # every axis must reach this many entities
  depth: detail                   # every scale down to this one is covered (detail = finest)
  min_entities_per_scale: 2
  target_mean_reward: 0.6         # mean stored reward over the graph
