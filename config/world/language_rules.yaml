    - 率
    - 比
    - 数値
    - 人口
    - 降水
    - 水深
    - 距離
    - 長さ
    - 重さ
    - 容量
    - 料金
    - 料
    - 費
    - 税
    - 生産
    - 搬出
    - 日量
    - 速度
    - 温度
    - 面積
  self_describing_measure_units:
    - 平方キロ
    - キロメートル
    - キロ
    - メートル
    - ヘクタール
    - ミリ
    - センチ
    - リットル
    - グラム
    - トン
    - パーセント
    - 割
    - 倍
    - 円
    - 年
    - か月
    - ヶ月
    - 日間
    - 時間
    - 世紀
    - 里
    - 度
  evaluation_words:
    - 重要
    - 貢献
    - 有意義
    - 重大
    - 不可欠
    - 効果的
  measure_units:
    - 平方キロ
    - キロメートル
    - キロ
    - メートル
    - ヘクタール
    - ミリ
    - センチ
    - リットル
    - グラム
    - トン
    - パーセント
    - 割
    - 倍
    - 円
    - 年
    - か月
    - ヶ月
    - 日間
    - 時間
    - 世紀
    - 里
    - 度
  abstract_words:
    - 様々な
    - さまざまな
    - 多様な
    - 重要な
    - 複雑な
    - 独特な
    - 色々
    - いろいろ
    - 多くの
    - 非常に
    - 大きな影響
    - 興味深い
  # Person markers are regex patterns (single kanji also occur inside
  # ordinary compounds, so they need a following particle or suffix).
  first_person_patterns:
    - (?<![公滅])私(?:は|が|の|を|に|も|で|たち|達|ども)
    - わたし(?:は|が|の|を|に|も|たち)?
    - わたくし
    - (?<![公下従奴童])僕(?:は|が|の|を|に|も|たち|ら)
    - ぼく(?:は|が|の|を|に|も|たち)?
    - 俺(?:は|が|の|を|に|も|たち|ら)
    - おれ(?:は|が|の|を|に|も|たち)
    - 我々
    - 吾輩
  second_person_patterns:
    - あなた
    - 貴方(?:は|が|の|を|に|も|たち)
    - (?<![諸暴名明賢幼聖])君(?:は|が(?!代)|の|を|に|も|たち|達|へ)
    - きみ(?:は|が|の|を|に|も|たち)
    - お前(?:は|が|の|を|に|も|たち|ら)
    - おまえ(?:は|が|の|を|に|も|たち|ら)
    - 貴殿
  speech_punct: "。！？!?"
  speech_after:
    - と(?:言|いっ|述べ|叫|呟|つぶや|答え|尋ね|語っ|怒鳴|囁|ささや|問う)
  speech_before: []
  flourish: [壮大な, 圧倒的, まさに, 驚くべき, 息をのむ, 決して忘れ, 運命の, 圧巻]

