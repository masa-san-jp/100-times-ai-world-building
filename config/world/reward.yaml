# Parameters for retained deterministic checks. Adoption uses step checks.
novelty:
  ngram_size: 3
  similarity_floor: 0.4
  duplicate_measure_penalty: 0.3
  duplicate_measure_cap: 0.45
  duplicate_phrase_penalty: 0.3
  duplicate_phrase_min_ngrams: 3
  duplicate_phrase_share: 0.18
specificity:
  min_fact_kinds: 3
  min_proper_noun_facts: 1
  require_numeral: true
  max_abstract_density: 0.04
  fact_echo_threshold: 0.6
  echo_min_chars: 2
  penalties:
    hollow_fact: 0.2
    hollow_cap: 0.5
    kind_coverage: 0.4
    proper_noun: 0.25
    numeral: 0.15
    abstract_density: 0.4
    unsupported_evaluation: 0.25
    unsupported_evaluation_cap: 0.4
    purpose_without_mechanism: 0.25
    no_facts: 0.6
consistency:
  penalties:
    graph_invalid: 0.5
    self_relation: 0.5
    relation_conflict: 0.4
    location_conflict: 0.3
    parent_type: 0.5
    temporal_order: 0.5
    number_conflict: 0.5
    premise_conflict: 0.5
    undefined_calendar: 0.4
    undefined_technology: 0.4
    undefined_unit: 0.0
    dimension_conflict: 0.5
    review_missing: 0.4
objectivity:
  penalties:
    quotation: 0.4
    first_person: 0.3
    second_person: 0.3
    exclamation: 0.2
    question: 0.15
    flourish: 0.15
provenance:
  penalties:
    no_anchor: 1.0
    unknown_reference: 0.4
    missing_reason: 0.4
